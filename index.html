<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Philippe Verlinde
</title>

<link rel="stylesheet"
      href="css/index.css">

</head>

<body>

<div class="container">

    <header class="site-header">

        <h1>
            PHILIPPE VERLINDE
        </h1>

        <div class="site-subtitle">
            FINE ART PHOTOGRAPHY
        </div>

    </header>

    <div id="gallery"
         class="gallery">
    </div>

    <div class="footer">

        CAPTURED MOMENTS<br>
        LASTING STORIES

    </div>

</div>

<script>

fetch("data/photos.json")

.then(response => response.json())

.then(data => {

    const gallery =
        document.getElementById("gallery");

    data.forEach(photo => {

        const card =
            document.createElement("a");

        card.href =
            "works/photo.html?id=" +
            photo.id;

        card.className =
            "card";

        card.innerHTML =

        `
            <img src="${photo.thumbnail}"
                 alt="${photo.title}">

            <div class="card-title">
                ${photo.title}
            </div>

            <div class="card-meta">
                ${photo.location} · ${photo.year}
            </div>
        `;

        gallery.appendChild(card);

    });

})

.catch(error => {

    console.error(error);

    document.getElementById("gallery")
        .innerHTML =
        "<p>Fout bij het laden van photos.json</p>";

});

</script>

</body>
</html>
