<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Detail</title>

    <link rel="stylesheet" href="../css/photo.css">

</head>

<body>

<div class="page">

    <header class="site-header">

        <div class="brand">

            <div class="logo">
                PHILIPPE VERLINDE
            </div>

            <div class="subtitle">
                FINE ART PHOTOGRAPHY
            </div>

        </div>

        <nav class="main-nav">

            <a href="../index.html">Expo</a>
            <a href="#">Over mij</a>
            <a href="#">Contact</a>

        </nav>

    </header>

    <div id="content"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const photoId = params.get("id");

fetch("../data/photos.json")

.then(response => response.json())

.then(data => {

    const photo = data.find(
        p => p.id === photoId
    );

    if(!photo){

        document.getElementById("content").innerHTML =
        `
            <h2>Foto niet gevonden</h2>
        `;

        return;
    }

    document.getElementById("content").innerHTML =
    `

    <section class="hero">

        <img
            src="${photo.image}"
            alt="${photo.title}"
            class="hero-image"
            loading="eager">

    </section>

    <section class="museum-content">

        <h1 class="title">
            ${photo.title}
        </h1>

        <div class="location">
            ${photo.location} · ${photo.year}
        </div>

        ${
            photo.audio
            ?
            `
            <div class="audio-section">

                <div class="audio-label">
                    🎧 Luister naar het verhaal achter dit beeld
                </div>

                <audio controls>
                    <source src="${photo.audio}">
                </audio>

            </div>
            `
            :
            ""
        }

        <div class="divider"></div>

        <section class="story-section">

            <h2>Het verhaal</h2>

            <p class="story-text">
                ${photo.story}
            </p>

        </section>

        <div class="divider"></div>

        <section class="technical-section">

            <p class="technical-line">

                ${photo.camera}
                ·
                ${photo.lens}

            </p>

            <p class="technical-line">

                ${photo.aperture}
                ·
                ${photo.shutter}
                ·
                ISO ${photo.iso}

            </p>

        </section>

        <div class="divider"></div>

        <section class="technique-section">

            <div class="technique-name">
                ${photo.technique}
            </div>

            <div class="technique-meta">
                ${photo.sourceImages} bronbeelden · ${photo.layers} lagen
            </div>

        </section>

    </section>

    ${
        photo.original
        ?
        `
        <section class="before-after">

            <h2>
                Van origineel naar eindbeeld
            </h2>

            <div class="comparison">

                <div class="comparison-item">

                    <img
                        src="${photo.original}"
                        alt="Origineel">

                    <div class="caption">
                        Originele opname
                    </div>

                </div>

                <div class="comparison-arrow">
                    →
                </div>

                <div class="comparison-item">

                    <img
                        src="${photo.image}"
                        alt="Eindresultaat">

                    <div class="caption">
                        Eindresultaat
                    </div>

                </div>

            </div>

        </section>
        `
        :
        ""
    }

    <section class="signature-section">

        <img
            src="../signature/signature.png"
            alt="Handtekening">

        <div class="signature-tag">

            CAPTURED MOMENTS<br>
            LASTING STORIES

        </div>

    </section>

    <section class="back-section">

        <a
            href="../index.html"
            class="back-link">

            ← Terug naar alle werken

        </a>

    </section>

    `;

})

.catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML =
    `
        <h2>Fout bij laden van gegevens</h2>
    `;

});

</script>

</body>
</html>
