<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Detail</title>
    <link rel="stylesheet" href="../css/photo.css">
</head>

<body>

<div class="page">

    <header class="header">

        <div>
            <div class="logo">
                PHILIPPE VERLINDE
            </div>

            <div class="subtitle">
                FINE ART PHOTOGRAPHY
            </div>
        </div>

        <nav>
            <a href="../index.html">Expo</a>
            <a href="#">Over mij</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <div id="content"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const photoId = params.get("id");

fetch("../data/photos.json")
.then(response => response.json())

.then(data => {

    const photo = data.find(
        p => p.id === photoId
    );

    if(!photo){

        document.getElementById("content")
            .innerHTML =
            "<h2>Foto niet gevonden</h2>";

        return;
    }

    document.getElementById("content")
    .innerHTML =

    `
    <div class="hero">

        <div class="image-column">

            <img
                class="main-image"
                src="${photo.image}"
                alt="${photo.title}">

        </div>

        <div class="info-column">

            <h1>
                ${photo.title}
            </h1>

            <div class="location">
                ${photo.location} · ${photo.year}
            </div>

            <div class="divider"></div>

            ${
                photo.audio
                ?
                `
                <div class="audio-box">
                    <div class="audio-title">
                    🎧 Luister naar het verhaal achter dit beeld
                    </div>

                    <audio controls>
                        <source src="${photo.audio}">
                    </audio>
                </div>
                `
                : ""
            }

            <h2>Het verhaal</h2>

            <p class="story">
                ${photo.story}
            </p>

        </div>

    </div>

    <section class="technical">

        <div class="tech-item">
            <div class="tech-value">${photo.camera}</div>
            <div class="tech-label">Camera</div>
        </div>

        <div class="tech-item">
            <div class="tech-value">${photo.lens}</div>
            <div class="tech-label">Lens</div>
        </div>

        <div class="tech-item">
            <div class="tech-value">${photo.aperture}</div>
            <div class="tech-label">Diafragma</div>
        </div>

        <div class="tech-item">
            <div class="tech-value">${photo.shutter}</div>
            <div class="tech-label">Sluitertijd</div>
        </div>

        <div class="tech-item">
            <div class="tech-value">${photo.iso}</div>
            <div class="tech-label">ISO</div>
        </div>
<section class="technique">

    <h2>
        Techniek
    </h2>

    <p>
        <strong>
            ${photo.technique}
        </strong>
    </p>

    <p>
        Bronbeelden:
        ${photo.sourceImages}
    </p>

    <p>
        Lagen:
        ${photo.layers}
    </p>

</section>
    </section>

    ${
        photo.original
        ?
        `
        <section class="before-after">

            <h2>
                Van origineel naar ICM
            </h2>

            <div class="compare">

                <div>
                    <img
                        src="${photo.original}"
                        alt="Origineel">

                    <div class="caption">
                        Originele opname
                    </div>
                </div>

                <div class="arrow">
                    →
                </div>

                <div>
                    <img
                        src="${photo.image}"
                        alt="ICM">

                    <div class="caption">
                        Eindresultaat
                    </div>
                </div>

            </div>

        </section>
        `
        : ""
    }

    <div class="back-link">

        <a href="../index.html">
            ← Terug naar overzicht
        </a>

    </div>

    `;
})

.catch(error => {

    console.error(error);

    document.getElementById("content")
        .innerHTML =
        "<h2>Fout bij laden van gegevens</h2>";
});

</script>

</body>
</html>
