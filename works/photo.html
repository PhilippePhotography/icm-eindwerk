<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Detail</title>
    <link rel="stylesheet" href="../css/photo.css">
</head>

<body>

<div class="page">

    <header class="site-header">

        <div class="brand">

            <div class="logo">
                PHILIPPE VERLINDE
            </div>

            <div class="subtitle">
                FINE ART PHOTOGRAPHY
            </div>

        </div>

        <nav class="main-nav">
            <a href="../index.html">Expo</a>
            <a href="#">Over mij</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <div id="content"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const photoId = params.get("id");

fetch("../data/photos.json")

.then(response => response.json())

.then(data => {

    const photo = data.find(
        p => p.id === photoId
    );

    if(!photo){

        document.getElementById("content").innerHTML = `
            <h2>Foto niet gevonden</h2>
        `;

        return;
    }

    document.getElementById("content").innerHTML = `

        <section class="hero">

    <img
        src="${photo.image}"
        alt="${photo.title}"
        class="hero-image"
        loading="eager">

</section>

<section class="artwork-info">

    <h1 class="artwork-title">
        ${photo.title}
    </h1>

    <div class="artwork-location">
        ${photo.location} · ${photo.year}
    </div>

    ${
        photo.audio
        ?
        `
        <div class="audio-section">

            <div class="audio-label">
                🎧 Luister naar het verhaal achter dit beeld
            </div>

            <audio controls>
                <source src="${photo.audio}">
            </audio>

        </div>
        `
        :
        ""
    }

    <div class="section-divider"></div>

    <section class="story-section">

        <h2>Het verhaal</h2>

        <p class="story-text">
            ${photo.story}
        </p>

    </section>

    <div class="section-divider"></div>

    <section class="tech-section">

        <div class="tech-line">

            <strong>${photo.camera}</strong>
            ·
            <strong>${photo.lens}</strong>

        </div>

        <div class="tech-line">

            <strong>${photo.aperture}</strong>
            ·
            <strong>${photo.shutter}</strong>
            ·
            <strong>ISO ${photo.iso}</strong>

        </div>

    </section>

    <div class="section-divider"></div>

    <section class="technique-section">

        <div class="technique-name">
            ${photo.technique}
        </div>

        <div class="technique-meta">
            ${photo.sourceImages} bronbeelden ·
            ${photo.layers} lagen
        </div>

    </section>

</section>

${
photo.original
?
`
<section class="before-after">

    <h2>
        Van origineel naar eindbeeld
    </h2>

    <div class="comparison">

        <div>

            <img
                src="${photo.original}"
                alt="Origineel">

            <div class="caption">
                Originele opname
            </div>

        </div>

        <div class="arrow">
            →
        </div>

        <div>

            <img
                src="${photo.image}"
                alt="Eindresultaat">

            <div class="caption">
                Eindresultaat
            </div>

        </div>

    </div>

</section>
`
:
""
}

<section class="signature-section">

    <img
        src="../signature/signature.png"
        alt="Philippe Verlinde">

    <div class="signature-text">

        Captured Moments<br>
        Lasting Stories

    </div>

</section>

<section class="back-section">

    <a
        href="../index.html"
        class="back-link">
        ← Terug naar alle werken
    </a>

</section>
            `
            :
            ""
        }

        <footer class="page-footer">

            <a
                href="../index.html"
                class="back-link">
                ← Terug naar alle werken
            </a>

            <div class="signature">

                <img
                    src="../signature/signature.png"
                    alt="Philippe Verlinde">

                <div class="signature-text">

                    CAPTURED MOMENTS<br>
                    LASTING STORIES

                </div>

            </div>

        </footer>

    `;

})

.catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML = `
        <h2>Fout bij laden van gegevens</h2>
    `;

});

</script>

</body>
</html>
