<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Detail</title>
    <link rel="stylesheet" href="../css/photo.css">
</head>

<body>

<div class="page">

    <header class="site-header">

        <div class="brand">

            <div class="logo">
                PHILIPPE VERLINDE
            </div>

            <div class="subtitle">
                FINE ART PHOTOGRAPHY
            </div>

        </div>

        <nav class="main-nav">
            <a href="../index.html">Expo</a>
            <a href="#">Over mij</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <div id="content"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const photoId = params.get("id");

fetch("../data/photos.json")

.then(response => response.json())

.then(data => {

    const photo = data.find(
        p => p.id === photoId
    );

    if(!photo){

        document.getElementById("content").innerHTML = `
            <h2>Foto niet gevonden</h2>
        `;

        return;
    }

    document.getElementById("content").innerHTML = `

        <section class="hero">

            <img
                src="${photo.image}"
                alt="${photo.title}"
                class="hero-image"
                loading="eager">

        </section>

        <section class="details-grid">

            <aside class="meta-column">

                <h1>${photo.title}</h1>

                <div class="meta-location">
                    ${photo.location} · ${photo.year}
                </div>

                <div class="meta-divider"></div>

                ${
                    photo.audio
                    ?
                    `
                    <div class="audio-block">

                        <div class="audio-title">
                            🎧 Luister naar het verhaal achter dit beeld
                        </div>

                        <audio controls>
                            <source src="${photo.audio}">
                        </audio>

                    </div>
                    `
                    :
                    ""
                }

                <div class="camera-data">

                    <div class="camera-item">
                        <span>Camera</span>
                        <strong>${photo.camera}</strong>
                    </div>

                    <div class="camera-item">
                        <span>Lens</span>
                        <strong>${photo.lens}</strong>
                    </div>

                    <div class="camera-item">
                        <span>Diafragma</span>
                        <strong>${photo.aperture}</strong>
                    </div>

                    <div class="camera-item">
                        <span>Sluitertijd</span>
                        <strong>${photo.shutter}</strong>
                    </div>

                    <div class="camera-item">
                        <span>ISO</span>
                        <strong>${photo.iso}</strong>
                    </div>

                </div>

            </aside>

            <article class="story-column">

                <h2>Het verhaal</h2>

                <p class="story-text">
                    ${photo.story}
                </p>

            </article>

        </section>

        <section class="technique-section">

            <h2>Techniek</h2>

            <h3>${photo.technique}</h3>

            <p>Bronbeelden: ${photo.sourceImages}</p>

            <p>Lagen: ${photo.layers}</p>

        </section>

        ${
            photo.original
            ?
            `
            <section class="before-after">

                <h2>Van origineel naar eindbeeld</h2>

                <div class="comparison">

                    <div class="comparison-image">

                        <img
                            src="${photo.original}"
                            alt="Origineel">

                        <p>Originele opname</p>

                    </div>

                    <div class="comparison-arrow">
                        →
                    </div>

                    <div class="comparison-image">

                        <img
                            src="${photo.image}"
                            alt="Eindresultaat">

                        <p>Eindresultaat</p>

                    </div>

                </div>

            </section>
            `
            :
            ""
        }

        <footer class="page-footer">

            <a
                href="../index.html"
                class="back-link">
                ← Terug naar alle werken
            </a>

            <div class="signature">

                <img
                    src="../signature/signature.png"
                    alt="Philippe Verlinde">

                <div class="signature-text">

                    CAPTURED MOMENTS<br>
                    LASTING STORIES

                </div>

            </div>

        </footer>

    `;

})

.catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML = `
        <h2>Fout bij laden van gegevens</h2>
    `;

});

</script>

</body>
</html>
